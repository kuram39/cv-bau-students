[project]
name = "cv-bau-students"
version = "0.1.0"
description = "Student / career-changer CV matching pipeline (BAU extension)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Martin" }]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cv_bau_students*"]

[tool.setuptools.package-data]
cv_bau_students = ["prompts/*.md", "data/*.csv", "data/*.sqlite.gz"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
