name: CI

# Merge gate: lint + format check + the full test suite. No secrets
# required — every test mocks llm.call_json, the DB fixture is in-memory
# SQLite, and bootstrap is never invoked from tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Black (format check)
        run: black --check src tests scripts

      - name: Pytest
        run: pytest -q
